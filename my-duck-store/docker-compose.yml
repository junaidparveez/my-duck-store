services:
  db:
    image: postgres:16-alpine
    container_name: duckstore-db
    environment:
      POSTGRES_DB: duckstore
      POSTGRES_USER: duckstore
      POSTGRES_PASSWORD: duckstore
    # Host port 5433: 5432 is often taken by a locally installed PostgreSQL.
    # The container still listens on 5432 internally.
    ports:
      - "5433:5432"
    volumes:
      - duckstore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckstore -d duckstore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  duckstore-data:
